name: loop-{{name}}
on:
  schedule:
    - cron: "*/30 * * * *"   # 与 loops/{{name}}/LOOP.md 的 cron 保持一致
  workflow_dispatch: {}
jobs:
  round:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g @earendil-works/pi-coding-agent@latest
      - name: Run loop round
        env:
          ANTHROPIC_API_KEY: ${{ secrets.PI_PROVIDER_KEY }}
        run: |
          pi -p --approve "执行 /skill:{{pattern}}（合同本体在 SKILL.md，跑完即走）；结束前在 loops/{{name}}/STATE.md 更新 Last run 行。L1 纪律：只读 + 只写 STATE.md 的 Last run 行。"
