services:
  pi-workspace:
    build:
      context: .
      dockerfile: Dockerfile
    image: pi-workspace:local
    init: true
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    environment:
      NODE_ENV: production
      PI_WEB_HOSTNAME: 0.0.0.0
      PI_WEB_NO_OPEN: "1"
      PI_WEB_ALLOWED_HOSTS: "${PI_WEB_ALLOWED_HOSTS:-}"
      PI_CODING_AGENT_DIR: /home/node/.pi/agent
      PI_WORKSPACES_DIR: /home/node/pi-workspaces
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"
    ports:
      - "${PI_WEB_BIND_ADDRESS:-127.0.0.1}:${PI_WEB_PORT:-30141}:30141"
    volumes:
      - "${PI_AGENT_DATA_DIR:-./data/pi-agent}:/home/node/.pi/agent"
      - "${PI_WORKSPACES_DATA_DIR:-./data/workspaces}:/home/node/pi-workspaces"
      - "${PI_SSH_DATA_DIR:-./data/ssh}:/home/node/.ssh:ro"
      - next-cache:/app/.next/cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:30141/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  next-cache:
